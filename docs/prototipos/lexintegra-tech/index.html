function productCard(p,i){return `<article class="product"><div class="product-top">${icon(p.icon)}<span class="product-category">${p.cat}</span></div><div class="product-body"><h2>${p.name}</h2><p>${p.desc}</p><div class="product-meta"><span>${icon('file')} ${p.items.length} ${p.items.length===1?'entregável':'entregáveis'}</span><span>${icon('video')} ${p.meet} ${p.meet===1?'reunião':'reuniões'}</span></div><div class="product-bottom row"><div class="price"><small>Valor do serviço</small>${money(p.price)}</div><button class="btn outline small" data-action="produto" data-id="${i}">Ver detalhes</button></div></div></article>`;}
function filteredProducts(){const result=products.map((p,i)=>({p,i})).filter(({p})=>(category==='Todos'||p.cat===category)&&p.name.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(query));return result.length?result.map(({p,i})=>productCard(p,i)).join(''):'<div class="empty"><h2>Nenhum serviço encontrado.</h2><p>Tente outro termo ou selecione todas as categorias.</p></div>';}
function catalog(){return `${nav()}<main id="conteudo" tabindex="-1" class="wrap"><header class="page-heading"><div class="kicker">${icon('grid')} Catálogo de serviços</div><div class="row"><h1>Qual é o próximo passo<br>da sua empresa?</h1><button class="btn outline" data-action="carrinho">${icon('bag')} <span id="cart-count">Carrinho (${cart.length})</span></button></div><p>Entenda o escopo. Compare entregas. Escolha com clareza.</p></header><div class="demo-note">Visualização após o pré-cadastro · serviços e valores fictícios para avaliar o layout.</div><div class="catalog-tools"><div class="pills" aria-label="Categorias">${['Todos','Contratos','Societário','Trabalhista','Privacidade'].map(c=>`<button class="pill" data-action="category" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><label class="search">${icon('search')}<input id="product-search" type="search" aria-label="Buscar serviço" placeholder="Buscar um serviço"></label></div><div class="catalog-grid" id="product-grid">${filteredProducts()}</div></main>${footer()}`;}
function login(){return `<main id="conteudo" tabindex="-1" class="login-layout"><section class="login-art"><a href="#home">${logo(true)}</a><div><h2>Seu trabalho jurídico.<br>Em um só lugar.</h2><p>Documentos, reuniões e próximos passos conectados à sua rotina.</p>${preview()}</div><p class="quote">Clareza para seguir em frente.</p></section><section class="login-form-wrap"><form class="login-form" id="login-form"><h1>Bom ter você por aqui.</h1><p>Acesse sua área para acompanhar seus pedidos.</p><div class="demo-note">Demonstração visual. Use os dados de exemplo abaixo; não informe credenciais reais.</div><label class="field">E-mail<input type="email" value="cliente@exemplo.com" autocomplete="off" required></label><label class="field">Senha<div class="password-field"><input id="password" type="password" value="demonstracao" autocomplete="off" required><button type="button" data-action="password" aria-label="Mostrar senha" aria-pressed="false">${icon('eye')}</button></div></label><button type="button" class="text-link" data-action="recuperar">Esqueci minha senha</button><button type="submit" class="btn">Entrar ${icon('arrow')}</button><p class="login-foot">Ainda não contratou? <button type="button" class="text-link" data-action="cadastro">Conheça os serviços</button></p><a class="text-link" href="#home">Voltar ao início</a></form></section></main>`;}
const people={cliente:['Ana Costa','Cliente','AC'],advogado:['Marina Alves','Advogada','MA'],admin:['Rafael Lima','Administrador','RL']};
function shell(role,content){const [name,title,initials]=people[role];const menus=role==='cliente'?[['folder','Meus pedidos','cliente'],['grid','Explorar serviços','catalogo'],['file','Ficha inicial','ficha']]:role==='advogado'?[['folder','Demandas','advogado'],['calendar','Agenda','agenda'],['clock','Disponibilidade','disponibilidade']]:[['route','Distribuição','admin'],['users','Clientes','clientes'],['users','Advogados','advogados'],['grid','Produtos','produtos'],['bag','Estornos','estornos'],['message','Entregas','entregas'],['video','Reuniões','reunioes']];return `<div class="workbench"><aside class="sidebar"><a href="#home">${logo()}</a><span class="workspace-label">Área ${role==='cliente'?'do cliente':role==='advogado'?'do advogado':'administrativa'}</span><nav class="side-nav" aria-label="Navegação do painel">${menus.map(([i,n,h])=>['cliente','catalogo','advogado','admin'].includes(h)?`<a href="#${h}" ${role===h?'aria-current="page"':''}>${icon(i)}${n}</a>`:`<button data-action="section" data-kind="${h}">${icon(i)}${n}</button>`).join('')}</nav><div class="side-bottom"><div class="support-note"><strong>Tudo tem seu contexto.</strong>Arquivos e reuniões ficam organizados dentro de cada pedido.</div><nav class="side-nav" style="margin-top:20px"><a href="#login">${icon('logout')} Sair da demonstração</a></nav></div></aside><div><header class="app-top"><span>Seu espaço / ${title}</span><div class="user"><div><b>${name}</b><small>${title}</small></div><div class="avatar">${initials}</div></div></header><main id="conteudo" tabindex="-1" class="app-main">${content}</main></div></div>`;}
function metrics(items){return `<div class="overview">${items.map(([n,label,i])=>`<div class="metric"><div class="icon-tile">${icon(i)}</div><div><b>${n}</b><span>${label}</span></div></div>`).join('')}</div>`;}
const orders=[{name:'Revisão de Contrato Comercial',id:'LX-2048',state:'Em revisão',cls:'',n:3,doc:'Contrato revisado com marcações',note:'Versão 2 disponível para sua conferência.',action:'Ver documento'},{name:'Elaboração de Contrato Social',id:'LX-2041',state:'Em elaboração',cls:'gold',n:2,doc:'Minuta do contrato social',note:'O documento está sendo preparado pela advogada.',action:'Ver andamento'},{name:'Parecer Jurídico Trabalhista',id:'LX-2026',state:'Entregue',cls:'green',n:4,doc:'Parecer fundamentado em PDF',note:'Entrega confirmada em 25 de setembro.',action:'Ver documento'}];
let orderFilter='Em andamento';
function orderCards(){return orders.filter(o=>orderFilter==='Todos'||(orderFilter==='Concluídos'?o.n===4:o.n<4)).map(o=>`<article class="order-card"><div class="row"><div><h2>${o.name}</h2><p class="order-sub">${o.id} · Marina Alves, advogada responsável</p></div>${badge(o.state,o.cls)}</div>${progress(o.n)}<div class="deliverable"><div class="row"><div class="icon-tile">${icon('file')}</div><div><strong>${o.doc}</strong><p>${o.note}</p></div></div><button class="btn ${o.n===3?'':'outline'} small" data-action="documento" data-id="${o.id}">${o.action}</button></div><div class="order-actions"><button class="text-link" data-action="reuniao" data-id="${o.id}">${icon('calendar')} Reuniões do pedido</button><button class="text-link" data-action="arquivos" data-id="${o.id}">${icon('folder')} Arquivos de apoio</button><button class="text-link" data-action="observacoes" data-id="${o.id}">${icon('message')} Observações</button></div></article>`).join('');}
function client(){return shell('cliente',`<header class="app-heading"><div><h1>Olá, Ana.</h1><p>Veja o que avançou e qual é o seu próximo passo.</p></div>${link('catalogo',`${icon('plus')} Contratar serviço`,'btn small')}</header>${metrics([[2,'Pedidos em andamento','folder'],[1,'Documento para revisar','file'],[1,'Pedido concluído','check']])}<div class="workspace-grid"><section><div class="pills" aria-label="Filtrar pedidos">${['Em andamento','Concluídos','Todos'].map(f=>`<button class="pill" data-action="order-filter" data-filter="${f}" aria-pressed="${f===orderFilter}">${f}</button>`).join('')}</div><div id="orders">${orderCards()}</div></section><aside><section class="panel"><h2>Agora é com você</h2><div class="next-action">${icon('file')}<b>Seu contrato está disponível.</b><p>Confira a versão enviada e solicite uma revisão, se precisar.</p><button class="text-link" data-action="documento" data-id="LX-2048" style="margin-top:15px">Conferir documento ${icon('arrow')}</button></div></section><section class="panel"><h2>Últimas atualizações</h2><div class="timeline-item"><b>Nova versão do contrato</b><br>Revisão de Contrato Comercial<time>Hoje, às 10h32</time></div><div class="timeline-item"><b>Trabalho iniciado</b><br>Elaboração de Contrato Social<time>Ontem, às 14h15</time></div><div class="timeline-item"><b>Entrega confirmada</b><br>Parecer Jurídico Trabalhista<time>25 set., às 16h40</time></div></section></aside></div>`);}
function lawyer(){return shell('advogado',`<header class="app-heading"><div><h1>Vamos ao próximo passo, Marina.</h1><p>Suas demandas, documentos e reuniões de hoje.</p></div><button class="btn outline small" data-action="section" data-kind="disponibilidade">${icon('clock')} Disponibilidade</button></header>${metrics([[3,'Demandas atribuídas','folder'],[1,'Em elaboração','file'],[2,'Reuniões nesta semana','calendar']])}<div class="workspace-grid"><section><div class="pills"><button class="pill" aria-pressed="true" data-action="lawyer-filter" data-filter="Todas">Todas as demandas</button><button class="pill" aria-pressed="false" data-action="lawyer-filter" data-filter="Solicitado">A iniciar</button><button class="pill" aria-pressed="false" data-action="lawyer-filter" data-filter="Em elaboração">Em elaboração</button></div><div class="table-panel"><div class="table-scroll"><table><thead><tr><th>Demanda / cliente</th><th>Estado do entregável</th><th>Ação</th></tr></thead><tbody id="lawyer-rows">${lawyerRows('Todas')}</tbody></table></div></div><div class="notice">${icon('shield')} Os documentos ficam disponíveis ao cliente após a verificação do arquivo.</div></section><aside><section class="panel"><h2>Sua agenda</h2><div class="agenda-day"><div class="date-box">set.<b>29</b></div><div><b>10h · Ana Costa</b><p>Contrato Social</p></div></div><div class="agenda-day"><div class="date-box">out.<b>01</b></div><div><b>14h · Bruno Santos</b><p>Due Diligence</p></div></div><button class="text-link" data-action="section" data-kind="agenda" style="margin-top:18px">Ver agenda ${icon('arrow')}</button></section></aside></div>`);}
function lawyerRows(filter){return [['Elaboração de Contrato Social','Ana Costa','Em elaboração','gold','Abrir demanda'],['Due Diligence Simplificada','Bruno Santos','Solicitado','blue','Iniciar trabalho'],['Revisão de Contrato Comercial','Ana Costa','Em revisão','','Ver documento']].filter(r=>filter==='Todas'||r[2]===filter).map(r=>`<tr><td><strong>${r[0]}</strong><small>${r[1]}</small></td><td>${badge(r[2],r[3])}</td><td><button class="text-link" data-action="demanda" data-kind="${r[0]}">${r[4]}</button></td></tr>`).join('');}
const assignments=[{name:'Adequação à LGPD',client:'Camila Oliveira',id:'LX-2052',lawyer:''},{name:'Elaboração de Contrato Social',client:'Pedro Martins',id:'LX-2051',lawyer:''},{name:'Revisão de Contrato Comercial',client:'Ana Costa',id:'LX-2048',lawyer:'Marina Alves'}];
let adminFilter='Pendentes';
function adminRows(){return assignments.filter(a=>adminFilter==='Todos'||!a.lawyer).map(a=>`<tr><td><strong>${a.name}</strong><small>${a.id}</small></td><td>${a.client}</td><td>${a.lawyer||badge('Aguardando atribuição','gold')}</td><td><button class="text-link" data-action="atribuir" data-id="${a.id}">${a.lawyer?'Reatribuir':'Atribuir advogado'}</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum pedido aguardando atribuição.</td></tr>';}
function admin(){const pending=assignments.filter(a=>!a.lawyer).length;return shell('admin',`<header class="app-heading"><div><h1>Distribuição de pedidos</h1><p>Conecte cada serviço ao profissional que vai conduzir o trabalho.</p></div><span class="badge gold">${pending} ${pending===1?'pendente':'pendentes'}</span></header>${metrics([[pending,'Aguardando atribuição','route'],[assignments.length-pending,'Pedidos distribuídos','check'],[3,'Advogados disponíveis','users']])}<div class="catalog-tools"><div class="pills"><button class="pill" data-action="admin-filter" data-filter="Pendentes" aria-pressed="${adminFilter==='Pendentes'}">Aguardando atribuição</button><button class="pill" data-action="admin-filter" data-filter="Todos" aria-pressed="${adminFilter==='Todos'}">Todos os pedidos</button></div><span class="muted" style="font-size:12px">Demonstração com ${assignments.length} pedidos</span></div><div class="table-panel"><div class="table-caption"><h2>Fila de distribuição</h2><p>Os pedidos ficam disponíveis ao advogado após a atribuição.</p></div><div class="table-scroll"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Responsável</th><th>Ação</th></tr></thead><tbody>${adminRows()}</tbody></table></div></div><div class="notice">${icon('lock')} Cada advogado tem acesso apenas aos pedidos que lhe foram atribuídos.</div>`);}
const app=document.getElementById('app'),dialog=document.getElementById('dialog');
function modal(title,body){document.getElementById('dialog-label').textContent=title;document.getElementById('dialog-body').innerHTML=body;dialog.showModal();}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),3500);}
function route(){const [name,anchor]=(location.hash.slice(1)||'home').split('/');const views={home,catalogo:catalog,login,cliente:client,advogado:lawyer,admin};const page=views[name]?name:'home';app.innerHTML=views[page]();if(page==='catalogo')document.getElementById('product-search').value=query;document.querySelectorAll('.prototype nav a').forEach(a=>{a.removeAttribute('aria-current');if(a.hash==='#'+page)a.setAttribute('aria-current','page');});document.title=`LexIntegra — ${page==='home'?'Início':page} · Protótipo`;if(dialog.open)dialog.close();window.scrollTo(0,0);document.getElementById('viewport').scrollTop=0;if(anchor)document.getElementById(anchor)?.scrollIntoView();}
window.addEventListener('hashchange',route);
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('conteudo').focus();});
document.getElementById('close-dialog').onclick=()=>dialog.close();
document.getElementById('mobile-preview').onclick=e=>{const on=document.getElementById('viewport').classList.toggle('phone');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Desktop':'Celular';};
document.addEventListener('input',e=>{if(e.target.id==='product-search'){query=e.target.value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');document.getElementById('product-grid').innerHTML=filteredProducts();}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form'){location.hash='cliente';toast('Você entrou na demonstração. Nenhuma autenticação foi realizada.');}if(e.target.id==='register-demo'){dialog.close();location.hash='catalogo';}if(e.target.id==='assign-form'){const a=assignments.find(a=>a.id===e.target.dataset.id);a.lawyer=e.target.elements.profissional.value;dialog.close();route();toast('Atribuição simulada. Nenhum dado foi enviado.');}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,kind=b.dataset.kind;
 if(action==='cadastro')modal('Acesso ao catálogo',`<h2>Encontre seu próximo serviço.</h2><p>O cadastro inicial libera o catálogo. Sua conta com senha será criada após a primeira compra.</p><div class="demo-note">Formulário ilustrativo, sem envio de dados. Os campos já estão preenchidos com exemplos.</div><form id="register-demo"><label class="field">Nome<input value="Ana Costa" required></label><label class="field">E-mail<input type="email" value="cliente@exemplo.com" required></label><label class="field">Telefone<input type="tel" value="(11) 99999-0000" required></label><button class="btn" type="submit">Ver catálogo de demonstração ${icon('arrow')}</button></form>`);
 if(action==='category'){category=b.dataset.category;document.querySelectorAll('[data-action="category"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('product-grid').innerHTML=filteredProducts();}
 if(action==='produto'){const p=products[Number(id)];modal('Detalhes do serviço',`<div class="icon-tile" style="margin-bottom:20px">${icon(p.icon)}</div><h2>${p.name}</h2><p>${p.desc}</p><strong>O que está incluído</strong><ul>${p.items.map(i=>`<li>${i}</li>`).join('')}<li>${p.meet} ${p.meet===1?'reunião':'reuniões'}</li><li>${p.rev} ${p.rev===1?'revisão permitida':'revisões permitidas'}</li></ul><div class="row"><span class="price">${money(p.price)}</span><button class="btn" data-action="add-cart" data-id="${id}" ${cart.includes(Number(id))?'disabled':''}>${cart.includes(Number(id))?'Adicionado':'Adicionar ao carrinho'}</button></div><p style="font-size:11px;margin-top:18px">Serviço e preço fictícios para validação visual.</p>`);}
 if(action==='add-cart'){cart.push(Number(id));b.disabled=true;b.textContent='Adicionado';const c=document.getElementById('cart-count');if(c)c.textContent=`Carrinho (${cart.length})`;toast('Serviço adicionado ao carrinho de demonstração.');}
 if(action==='carrinho'){modal('Carrinho de demonstração',`<h2>Seus serviços</h2>${cart.length?cart.map(i=>`<div class="row" style="padding:15px 0;border-bottom:1px solid var(--line)"><span>${products[i].name}</span><button class="text-link" data-action="remove-cart" data-id="${i}">Remover</button></div>`).join('')+`<p style="margin-top:20px">Total: <strong>${money(cart.reduce((sum,i)=>sum+products[i].price,0))}</strong></p><div class="demo-note">A compra não é executada neste protótipo. Esta etapa valida a escolha dos serviços.</div>`:'<p>Seu carrinho está vazio. Explore os serviços para começar.</p>'}`);}
 if(action==='remove-cart'){cart=cart.filter(i=>i!==Number(id));dialog.close();document.getElementById('cart-count').textContent=`Carrinho (${cart.length})`;document.querySelector('[data-action="carrinho"]').click();}
 if(action==='password'){const p=document.getElementById('password'),show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');b.setAttribute('aria-pressed',String(show));}
 if(action==='recuperar')modal('Recuperar acesso','<h2>Esqueceu sua senha?</h2><p>Na plataforma, você informa seu e-mail para receber as orientações de redefinição.</p><label class="field">E-mail<input type="email" value="cliente@exemplo.com"></label><button class="btn" data-action="fake-reset">Simular envio de orientações</button>');
 if(action==='fake-reset'){dialog.close();toast('Simulação concluída. Nenhum e-mail foi enviado.');}
 if(action==='order-filter'){orderFilter=b.dataset.filter;document.querySelectorAll('[data-action="order-filter"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('orders').innerHTML=orderCards();}
 if(action==='documento'){const o=orders.find(o=>o.id===id);modal(`Pedido ${id}`,`<h2>${o.doc}</h2>${badge(o.state,o.cls)}<p style="margin-top:18px">${o.note}</p>${o.n===2?'<p>Você receberá uma atualização quando o arquivo estiver disponível para conferência.</p>':'<div class="deliverable"><div class="row">'+icon('file')+'<div><strong>Documento do pedido.pdf</strong><p>PDF · arquivo ilustrativo</p></div></div></div><p style="margin-top:20px">No sistema, o download depende da verificação do arquivo e do aceite dos termos da versão. Nenhum arquivo real é baixado aqui.</p>'}<button class="btn outline" data-action="close">Voltar ao pedido</button>`);}
 if(action==='reuniao')modal(`Reuniões · ${id}`,`<h2>Converse sobre seu pedido.</h2><p>Os horários e o saldo abaixo são ilustrativos e pertencem ao pedido ${id}.</p><div class="agenda-day"><div class="date-box">set.<b>29</b></div><div><b>10h · Marina Alves</b><p>Reunião do pedido · sala ainda não disponível</p></div></div><div class="demo-note">A entrada na reunião será exibida quando a sala estiver disponível. O protótipo não agenda nem gera links.</div><button class="btn outline" data-action="close">Voltar ao pedido</button>`);
 if(action==='arquivos')modal(`Arquivos de apoio · ${id}`,`<h2>Informações para o trabalho.</h2><p>Até 3 arquivos de apoio, em JPG ou PDF, com até 5 MB cada.</p><div class="deliverable">${icon('file')} Contrato original.pdf ${badge('Limpo','green')}</div><div class="deliverable">${icon('file')} Documento da empresa.pdf ${badge('Em verificação','gold')}</div><p style="margin-top:20px">Prévia de estados de arquivo. Nenhum arquivo é enviado ou disponibilizado neste HTML.</p>`);
 if(action==='observacoes')modal(`Observações · ${id}`,`<h2>O contexto fica por aqui.</h2><div class="panel"><b>Marina Alves</b><p style="margin-top:10px">A nova versão do contrato está disponível. Revise as cláusulas destacadas antes de confirmar a entrega.</p><small>Hoje, às 10h32 · exemplo fictício</small></div>`);
 if(action==='lawyer-filter'){document.querySelectorAll('[data-action="lawyer-filter"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('lawyer-rows').innerHTML=lawyerRows(b.dataset.filter);}
 if(action==='demanda')modal('Demanda atribuída',`<h2>${kind}</h2><p>Visão ilustrativa do espaço de trabalho do advogado.</p><div class="panel"><h3>Entregáveis</h3><p style="margin-top:12px">Confira as informações do cliente, registre observações e envie a versão preparada do documento.</p></div><div class="demo-note" style="margin-top:20px">Ações de início de trabalho, upload e entrega serão conectadas ao fluxo existente após a aprovação visual.</div>`);
 if(action==='admin-filter'){adminFilter=b.dataset.filter;route();}
 if(action==='atribuir'){const a=assignments.find(a=>a.id===id);modal('Distribuição',`<h2>Atribuir responsável</h2><p>${a.name}<br>${a.client} · ${a.id}</p><form id="assign-form" data-id="${id}"><label class="field">Advogado responsável<select name="profissional"><option>Marina Alves</option><option>Lucas Ferreira</option><option>Beatriz Souza</option></select></label><div class="demo-note">Atribuição demonstrativa, mantida apenas enquanto este HTML estiver aberto.</div><button class="btn" type="submit">Confirmar atribuição simulada</button></form>`);}
 if(action==='section'){const sections={ficha:['Ficha inicial','Informações da empresa e contexto para o atendimento. O questionário definitivo será preservado conforme o fluxo existente.'],agenda:['Agenda da semana','29 de setembro, 10h — Ana Costa · Contrato Social. 1º de outubro, 14h — Bruno Santos · Due Diligence.'],disponibilidade:['Sua disponibilidade','Exemplo de apresentação dos horários da semana.'],clientes:['Clientes','Consulta administrativa de clientes e seus pedidos.'],advogados:['Advogados','Cadastro, perfil e situação dos profissionais.'],produtos:['Produtos','Administração de escopo, preço e ativação dos serviços.'],estornos:['Estornos','Acompanhamento das solicitações conforme as regras existentes.'],entregas:['Entregas de notificações','Situação das notificações e tentativas de entrega.'],reunioes:['Reuniões','Acompanhamento das reuniões que precisam de atenção.']};const [title,desc]=sections[kind];modal(title,`<h2>${title}</h2><p>${desc}</p>${kind==='disponibilidade'?'<div class="pills"><span class="badge green">Terça · 10h</span><span class="badge green">Quinta · 14h</span><span class="badge green">Sexta · 9h</span></div>':''}<div class="demo-note" style="margin-top:20px">Esta tela complementar está fora das seis telas de validação. Sua implementação seguirá a direção visual aprovada.</div>`);}
 if(action==='legal')modal(kind,`<h2>${kind}</h2><p>Na implementação, este link abrirá o documento jurídico versionado já existente na LexIntegra. A presente proposta avalia apenas a apresentação visual.</p>`);
 if(action==='close')dialog.close();
});
route();
</script></body></html>

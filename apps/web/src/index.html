<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>LexIntegra</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plataforma de contratação e acompanhamento de produtos jurídicos."
    />

    <!--
      ADR-09: WhatsApp, Instagram, LinkedIn e Telegram nao executam JavaScript e
      leem apenas estas tags do HTML servido. E por isso que as rotas publicas sao
      pre-renderizadas em build (outputMode: static).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LexIntegra" />
    <meta property="og:title" content="LexIntegra" />
    <meta
      property="og:description"
      content="Plataforma de contratação e acompanhamento de produtos jurídicos."
    />
    <meta property="og:url" content="https://lexintegra.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

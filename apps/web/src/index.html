<!doctype html>
<html lang="pt-BR" data-direcao="catedra">
  <head>
    <meta charset="utf-8" />
    <title>LexIntegra</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plataforma de contratação e acompanhamento de produtos jurídicos."
    />

    <!--
      ADR-09: WhatsApp, Instagram, LinkedIn e Telegram nao executam JavaScript e
      leem apenas estas tags do HTML servido. E por isso que as rotas publicas sao
      pre-renderizadas em build (outputMode: static).
    -->
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://lexintegra.com.br/imagens/confianca-lexintegra.jpg"
    />
    <meta property="og:site_name" content="LexIntegra" />
    <meta property="og:title" content="LexIntegra" />
    <meta
      property="og:description"
      content="Plataforma de contratação e acompanhamento de produtos jurídicos."
    />
    <meta property="og:url" content="https://lexintegra.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      PWA (05/10/2026): instalavel no Chrome (Android e desktop) e no Safari
      (iOS e macOS, "Adicionar a Tela de Inicio" / "Adicionar ao Dock"). O
      manifesto basta para o Chrome desde que ele deixou de exigir service
      worker; o Safari le o manifesto para abrir em tela cheia e o
      `apple-touch-icon` para o icone, que precisa ser opaco (transparente vira
      preto no iOS). `theme-color` e o `--lex-bg` da Nevoa. Sem service worker,
      de proposito: ver `src/pwa.spec.ts`.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e2e8ee" />
    <link rel="apple-touch-icon" href="/icones/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LexIntegra" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

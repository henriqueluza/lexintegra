<ul class="resumo" role="list" [class.resumo--muitos]="itens().length > 3">
  @for (item of itens(); track item.rotulo) {
  <li class="resumo__item">
    <span class="resumo__icone" aria-hidden="true"
      ><app-icone [nome]="item.icone" tamanho="p"
    /></span>
    <div>
      <span class="resumo__rotulo">{{ item.rotulo }}</span>
      <strong class="resumo__valor">{{ item.valor }}</strong>
    </div>
  </li>
  }
</ul>

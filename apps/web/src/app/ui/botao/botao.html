<button
  class="botao"
  [class.botao--primario]="variante() === 'primario'"
  [class.botao--secundario]="variante() === 'secundario'"
  [class.botao--fantasma]="variante() === 'fantasma'"
  [class.botao--texto]="variante() === 'texto'"
  [class.botao--p]="tamanho() === 'p'"
  [type]="tipo()"
  [disabled]="desabilitado()"
  [attr.aria-disabled]="carregando() ? 'true' : null"
  [attr.aria-busy]="carregando() ? 'true' : null"
  [attr.aria-label]="rotuloAcessivel()"
  (click)="aoClicar($event)"
>
  @if (carregando()) {
  <span class="botao__giro" aria-hidden="true"></span>
  } @else if (icone() !== null) {
  <app-icone [nome]="icone()!" tamanho="p" />
  }
  <span class="botao__rotulo"><ng-content /></span>
</button>

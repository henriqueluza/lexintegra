<!--
  Os quatro itens são exigência da análise do AbacatePay e precisam estar no
  HTML pré-renderizado da home (há teste no e2e): nome, CNPJ, e-mail de contato
  e os links para termos e privacidade. Nada mais entra aqui — em especial,
  nenhum link para âncora da landing, que no celular não tem as seções.
-->
<footer class="rodape">
  <div class="rodape__grade">
    <div class="rodape__marca">
      <a href="/" aria-label="LexIntegra — início">LexIntegra</a>
      <p>Contratação e acompanhamento de serviços jurídicos para empresas.</p>
      <p>CNPJ: {{ contato.cnpj }}</p>
    </div>
    <nav aria-label="Atendimento">
      <h2>Contato</h2>
      <a [href]="'mailto:' + contato.email">{{ contato.email }}</a>
    </nav>
    <nav aria-label="Informações legais">
      <h2>Informações legais</h2>
      <a href="/termos">Termos de uso</a
      ><a href="/privacidade">Política de privacidade</a>
    </nav>
  </div>
  <p class="rodape__base">
    © 2026 LexIntegra. Serviços jurídicos, conectados a você.
  </p>
</footer>

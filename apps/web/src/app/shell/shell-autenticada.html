<div
  class="shell"
  [class.shell--cliente]="navegacao().length === 0"
  data-direcao="pauta"
>
  <header class="shell__topo">
    <div class="shell__identidade">
      <a class="shell__marca" routerLink="/">LexIntegra</a
      ><span class="shell__ambiente">Área de trabalho</span>
      <span class="shell__usuario">{{ descricaoDoUsuario() }}</span>
    </div>

    @if (navegacao().length > 0) {
    <nav class="shell__nav" aria-label="Secoes da administracao">
      @for (item of navegacao(); track item.rota) {
      <a
        class="shell__link"
        [routerLink]="item.rota"
        routerLinkActive="shell__link--ativo"
        >{{ item.rotulo }}</a
      >
      }
    </nav>
    }

    <a class="shell__servicos" routerLink="/servicos">Conhecer serviços</a>
    <app-botao variante="secundario" tamanho="p" (click)="sair()">
      Sair
    </app-botao>
  </header>

  <main class="shell__conteudo">
    <router-outlet />
  </main>
</div>

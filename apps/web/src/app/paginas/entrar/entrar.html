<app-moldura-acesso
  [titulo]="['Seu trabalho jurídico.', 'Em um só lugar.']"
  texto="Documentos, reuniões e próximos passos de cada pedido, conectados à sua rotina."
>
  <h1>Bom ter você por aqui.</h1>
  <p class="apoio">Acesse sua área para acompanhar seus pedidos.</p>

  <form [formGroup]="formulario" (ngSubmit)="enviar()">
    <app-campo
      rotulo="E-mail"
      tipo="email"
      formControlName="email"
      [obrigatorio]="true"
      [erro]="erroDoCampo('email')"
    />

    <app-campo
      rotulo="Senha"
      tipo="password"
      formControlName="senha"
      [obrigatorio]="true"
      [erro]="erroDoCampo('senha')"
    />

    <a class="link" routerLink="/recuperar-senha">Esqueci minha senha</a>

    @if (falha(); as motivo) {
    <app-mensagem-erro variante="bloco"
      >{{ mensagemDaFalha(motivo) }}</app-mensagem-erro
    >
    }

    <app-botao variante="primario" tipo="submit" [carregando]="enviando()">
      Entrar
    </app-botao>
  </form>

  <div class="rodape">
    <p>
      Ainda não contratou? <a routerLink="/servicos">Conheça os serviços</a>
    </p>
    <p>
      Primeiro acesso depois da compra? Use o link enviado ao seu e-mail para
      definir sua senha.
    </p>
  </div>
</app-moldura-acesso>

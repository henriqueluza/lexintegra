<app-moldura-acesso
  [titulo]="['Encontre seu próximo', 'serviço jurídico.']"
  texto="O cadastro libera o catálogo com escopos e preços. Sem compromisso de contratação."
>
  <h1>Comece pelo cadastro.</h1>
  <aside class="retomar-acesso" aria-label="Retomar seu acesso">
    <strong>Já fez o pré-cadastro?</strong>
    <p>
      Mesmo sem ter comprado, você pode criar uma senha e voltar aos serviços
      sem preencher tudo de novo.
    </p>
    <a href="/recuperar-senha">Criar ou recuperar senha</a>
  </aside>
  <app-cadastro />
  <div class="rodape">
    <p>Já tem uma senha? <a href="/entrar">Entre na sua área</a></p>
  </div>
</app-moldura-acesso>

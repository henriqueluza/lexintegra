<dialog
  #dialogo
  tabindex="-1"
  data-lenis-prevent
  aria-labelledby="convite-titulo"
  aria-describedby="convite-texto"
  (cancel)="fechar($event)"
  (keydown)="conterFoco($event)"
>
  <button
    class="fechar"
    type="button"
    aria-label="Fechar convite"
    (click)="fechar()"
    autofocus
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m6 6 12 12M18 6 6 18" />
    </svg>
  </button>
  <h2 id="convite-titulo">{{ textos.titulo }}</h2>
  <p id="convite-texto">{{ textos.texto }}</p>
  <a class="acao" href="/cadastro">{{ textos.acao }}</a>
  <button class="depois" type="button" (click)="fechar()">
    Continuar explorando
  </button>
</dialog>
